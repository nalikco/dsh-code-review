name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Remove runner Git LFS filter defaults
        shell: bash
        run: |
          # Hosted images register LFS globally and system-wide. Our production
          # preflight intentionally rejects executable filters, even unused ones.
          # Change only this disposable runner, never weaken that preflight.
          git config --global --remove-section filter.lfs || test "$?" -eq 128
          sudo git config --system --remove-section filter.lfs || test "$?" -eq 128
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:all
      - run: npm run test:package
      - name: Verify symlinked temporary directory
        shell: bash
        run: |
          ln -s "$RUNNER_TEMP" "$GITHUB_WORKSPACE/.package-temp-alias"
          TMPDIR="$GITHUB_WORKSPACE/.package-temp-alias" npm run test:package
